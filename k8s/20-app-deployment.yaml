apiVersion: apps/v1
kind: Deployment
metadata:
  name: country-info-service
  namespace: country-info
  labels:
    app: country-info-service
spec:
  replicas: 2                       # the HPA takes over scaling after deploy
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0             # zero-downtime rollouts
  selector:
    matchLabels:
      app: country-info-service
  template:
    metadata:
      labels:
        app: country-info-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas across nodes so one node failure does not take the service down
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: country-info-service
      initContainers:
        # Wait for MySQL so the app does not crash-loop on first deploy
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql.country-info.svc.cluster.local 3306; do echo waiting for mysql; sleep 3; done"]
      containers:
        - name: app
          image: country-info-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: country-info-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: { name: country-info-db, key: DB_USERNAME }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: country-info-db, key: DB_PASSWORD }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp                # Tomcat needs a writable temp dir
              mountPath: /tmp
          # Startup probe gives the JVM time to boot before liveness checks begin
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 30       # up to 150s to start
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }   # includes the DB check
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              # Let the Service stop routing to this pod before the JVM starts shutting down
              exec:
                command: ["sh", "-c", "sleep 10"]
      volumes:
        - name: tmp
          emptyDir: {}
