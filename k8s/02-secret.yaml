# Demo credentials only. In a real cluster create this from a vault
# (Sealed Secrets, External Secrets Operator, etc.) and never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: country-info-db
  namespace: country-info
type: Opaque
stringData:
  DB_USERNAME: country_user
  DB_PASSWORD: change-me-app
  MYSQL_ROOT_PASSWORD: change-me-root
