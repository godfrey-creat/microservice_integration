# In-memory database in MySQL mode; Flyway runs the real migration against it
spring.datasource.url=jdbc:h2:mem:countrydb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Tests mock the SOAP client; disable caching so each test sees its own stubs
spring.cache.type=none
country-info.soap.endpoint-url=http://localhost:0/not-used-in-tests
