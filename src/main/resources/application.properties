spring.application.name=country-info-service

# MySQL - values can be overridden by environment variables (used later in Kubernetes)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/countrydb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:country_user}
spring.datasource.password=${DB_PASSWORD:country_pass}

spring.jpa.open-in-view=false

# SOAP service (Step 4) - overridable per environment
country-info.soap.endpoint-url=${SOAP_ENDPOINT_URL:http://webservices.oorsprong.org/websamples.countryinfo/CountryInfoService.wso}
country-info.soap.connect-timeout=${SOAP_CONNECT_TIMEOUT:3s}
country-info.soap.read-timeout=${SOAP_READ_TIMEOUT:5s}

# Step 6: Flyway owns the schema; Hibernate never changes tables itself
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
# Load languages for many countries in one query instead of one query per country (avoids N+1)
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ---------- Hardening ----------
# Finish in-flight requests before shutting down (rolling deploys in Kubernetes)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=5000

# Cache SOAP lookups: country data almost never changes
spring.cache.cache-names=isoCodes,fullCountryInfo
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=6h,recordStats

# Retry: 3 attempts with exponential backoff (300ms, 600ms), only for real failures
resilience4j.retry.instances.countryInfoSoap.max-attempts=3
resilience4j.retry.instances.countryInfoSoap.wait-duration=300ms
resilience4j.retry.instances.countryInfoSoap.enable-exponential-backoff=true
resilience4j.retry.instances.countryInfoSoap.exponential-backoff-multiplier=2
resilience4j.retry.instances.countryInfoSoap.retry-exceptions[0]=com.ncba.countryinfo.exception.SoapServiceException
resilience4j.retry.instances.countryInfoSoap.ignore-exceptions[0]=com.ncba.countryinfo.exception.CountryNotFoundException

# Circuit breaker: open when >=50% of the last 20 calls fail or are slow; fail fast for 30s
resilience4j.circuitbreaker.instances.countryInfoSoap.register-health-indicator=true
resilience4j.circuitbreaker.instances.countryInfoSoap.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.countryInfoSoap.sliding-window-size=20
resilience4j.circuitbreaker.instances.countryInfoSoap.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.countryInfoSoap.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.countryInfoSoap.slow-call-duration-threshold=4s
resilience4j.circuitbreaker.instances.countryInfoSoap.slow-call-rate-threshold=80
resilience4j.circuitbreaker.instances.countryInfoSoap.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.countryInfoSoap.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.countryInfoSoap.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.countryInfoSoap.ignore-exceptions[0]=com.ncba.countryinfo.exception.CountryNotFoundException

# Health checks and metrics
management.endpoints.web.exposure.include=health,info,prometheus,metrics,circuitbreakers,retries,caches
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.group.readiness.include=readinessState,db
management.health.circuitbreakers.enabled=true
management.metrics.tags.application=${spring.application.name}

# Logging: correlation id on every line (local, human-readable)
logging.pattern.level=%5p [%X{correlationId:-no-cid}]
logging.level.com.ncba.countryinfo=${APP_LOG_LEVEL:INFO}
